# Команда проекта: маршрутизация ролей, бюджеты, приёмка.
# Читается людьми и инструментами: Hermes, Pi, Cursor, Codex.
project: "Ролик про ИИ — сценарий (13 глав в v4/)"

# ЧТО ГДЕ ЛЕЖИТ
paths:
  text: "v4/"                    # главы сценария
  style: "v4/STYLE.md"           # закон языка
  core: "v4/смысловое-ядро.md"   # карта смыслов
  zloba: "v4/злоба-дня.md"       # реестр болей дня (только с якорем)
  anchors: "v4/анкоры-рой.md"    # реестр исследований
  briefs: ".factory/briefs/"     # задания
  goals: ".factory/goals/"       # отчёты
  drafts: ".factory/drafts/"     # врезки до вставки
  checks: ".factory/logs/"       # скрипты проверок
  archive: ".factory/archive/"   # история

# РОЛИ: кто на чём сидит и что может
roles:
  lead:
    harness: pi
    role_flag: lead
    model: null                  # модель инструмента; --model лиду не передавать
    can: ["читать всё", "решать состав работы", "звать роли"]
    cannot: ["писать главы"]
    duty: "сверить бриф с деревом и не отдавать команде уже сделанное"

  writer:
    harness: pi
    model: "cursor-acp/default"  # короткие правки
    model_alt: "openrouter/deepseek/deepseek-v4.1-flash"  # если прогон длинный
    can: ["править главы строго по брифу"]
    cannot: ["менять смысл абзаца", "добавлять утверждения без основания", "коммитить"]

  analyst:
    harness: pi
    model: "openrouter/deepseek/deepseek-v4.1-flash"
    can: ["читать", "собирать документы и разборы"]
    cannot: ["править главы", "коммитить"]

  auditor:
    harness: pi
    role_flag: auditor
    model: "openrouter/deepseek/deepseek-v4.1-flash"
    can: ["читать", "выносить вердикт", "писать артефакт проверки"]
    cannot: ["править текст", "коммитить"]
    duty: "один заход на главу, после того как глава отредактирована целиком"

  techwriter:
    harness: pi
    role_flag: techwriter
    model: "openrouter/deepseek/deepseek-v4.1-flash"
    can: ["править служебные документы"]
    cannot: ["править главы", "коммитить"]

# ПРЕДОХРАНИТЕЛИ
limits:
  fail_budget_per_task: 2        # после второго провала — остановка и вопрос человеку
  expensive_model_for_drafts: false
  commit_and_push: "только по слову заказчика"
  subagents: "исполнителю звать нельзя, если в брифе сказано «исполнитель один»"

# ПРИЁМКА
acceptance:
  rule: "у каждого требования в задании есть повторяемый сигнал: скрипт или команда"
  metrics_from_writer: false     # количественные метрики от писателя не требовать
  semantic: true                 # судить смысл, а не совпадение формулировок
  semantic_rule: >
    Новая формулировка вместо старой — не находка. Отсутствие слова из карты — не находка,
    если мысль сказана иначе. Находка только там, где смысл искажён, где противоречие с ядром,
    законом или соседним местом, где факт взят без якоря или подан не по статусу реестра,
    где термин не расшифрован, где абзац выпадает из общего контекста ролика.
  verdict_source: ".factory/goals/"

  # Два этапа: якоря сверяются с открытым источником один раз при сборе,
  # текст сверяется с реестрами на каждом аудите. Интернета у аудитора нет.
  stages:
    1_anchors:
      who: "роль с доступом к сети (сборщик якорей)"
      what: "открыть источник, вычитать, записать ссылку, цитату и дату сверки в реестр"
      when: "при добавлении или изменении записи реестра"
    2_text:
      who: "аудитор"
      what: "сверить текст с реестрами: наличие якоря, посимвольное совпадение чисел, честность статуса (факт · позиция вендора · наш вывод), отсутствие противоречий с ядром и законом"
      when: "после полной редакции главы"
  registries:
    zloba: { file: "v4/злоба-дня.md", verified: "частично: 2026-11-16 сверены рынок ставок и подкаст вендора; остальные записи собраны раньше" }
    anchors: { file: "v4/анкоры-рой.md", verified: "частично: 2026-11-16 сверены Смит 1980, Герки и Матарич 2004, Легг и Хаттер 2007, Холле 2019" }

  checks:
    - cmd: "python .factory/logs/check_rules.py"
      signal: "ВСЁ ВАЛИДНО"
      covers: "стоп-лист, выдуманные слова, пояснения, места образов"
    - cmd: "python .factory/logs/check_core.py"
      signal: "ЯДРО СВЕРЯЕТСЯ"
      covers: "карта смыслов против текста"
    - cmd: "python .factory/logs/check_vrezki.py"
      signal: "СОВПАДАЮТ"
      covers: "черновики врезок против глав"
    - cmd: "python .factory/logs/check_text.py"
      signal: "ЧИСТО"
      covers: "дубли между главами, частые зачины, назван ли лейтмотив, двойные пояснения"

# МОДЕЛИ: чего избегать
model_notes:
  - "cursor-acp рвётся на длинных прогонах: сессия обрывается после промпта, артефакта нет; для чтения и анализа — deepseek"
  - "роль задаётся флагом --role, модель роли перебивается --model только осознанно"
